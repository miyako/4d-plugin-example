name: Pipeline drift

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce generated pipeline from its clean gitlink
        run: python3 scripts/check_tutorial_pipeline.py
      - name: Pin and generated drift regression tests
        run: python3 -m unittest discover -s scripts/tests -p test_tutorial_pipeline.py -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint
